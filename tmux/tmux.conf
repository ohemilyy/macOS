# Clean tmux defaults for local work and long-running SSH sessions.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 10
set -g focus-events on
set -g status-interval 5
set -g display-time 1500

setw -g mode-keys vi
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g status-style "bg=#0b1020,fg=#c8d3f5"
set -g status-left "#[fg=#c099ff,bold] ◌ #S #[default]"
set -g status-left-length 30
set -g window-status-format " #[fg=#636da6]#I:#W "
set -g window-status-current-format " #[fg=#0b1020,bg=#82aaff,bold] #I:#W #[default]"
set -g status-right "#[fg=#86e1fc]#H #[fg=#636da6]%Y-%m-%d #[fg=#c8d3f5]%H:%M "
set -g pane-border-style "fg=#1e2030"
set -g pane-active-border-style "fg=#82aaff"
set -g message-style "bg=#1e2030,fg=#ffc777"
